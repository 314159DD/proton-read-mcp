[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-read-mcp"
version = "0.1.0"
description = "Read-only Proton Mail MCP server (via Proton Bridge IMAP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Steven Obst" }]
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
proton-read-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
